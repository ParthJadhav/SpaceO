name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Release configuration dry run
        run: |
          bash -n scripts/make-viewer-app.sh scripts/release.sh
          node --check scripts/mcp-smoke.mjs
          bash scripts/release.sh check
          bash scripts/release.sh dry-run
      - name: Tests
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: MCP black-box smoke test
        run: node scripts/mcp-smoke.mjs .build/release/spaceo
