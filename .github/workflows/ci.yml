name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test --filter UnitTests
      - name: Release build
        run: swift build -c release
      - name: MCP black-box smoke test
        run: node scripts/mcp-smoke.mjs .build/release/spaceo
