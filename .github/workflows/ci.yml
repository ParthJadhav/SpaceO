name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    # SpaceO ships for Apple Silicon. The versioned label avoids macos-latest architecture drift.
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      SPACEO_REQUIRED_XCODE_VERSION: "26.0.1"
      SPACEO_REQUIRED_SWIFT_VERSION: "6.2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require pinned release toolchain
        run: bash scripts/check-swift-toolchain.sh
      - name: Release configuration dry run
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          bash -n scripts/check-swift-toolchain.sh scripts/make-viewer-app.sh scripts/release.sh scripts/test.sh
          bash -n scripts/check-workflow-outputs.sh
          node --check scripts/mcp-smoke.mjs
          bash scripts/release.sh check
          bash scripts/release.sh dry-run
      # The release workflow is only exercised end to end by a tag push, so its policy assertions
      # have to run here to be able to fail a pull request that breaks them.
      - name: Release security policy
        run: bash Tests/ReleaseSecurityTests.sh
      # --online re-derives each pinned action's declared outputs from its action.yml at the pinned
      # SHA, so .github/pinned-action-outputs.txt cannot drift away from what the action really has.
      - name: Verify pinned action output references
        run: bash scripts/check-workflow-outputs.sh --online
      - name: Safe tests (no WindowServer, apps, or input)
        run: bash scripts/test.sh safe
      - name: Release build
        run: swift build -c release
      - name: MCP black-box smoke test
        run: node scripts/mcp-smoke.mjs .build/release/spaceo
