name: Live qualification

on:
  workflow_call:
    inputs:
      release_ref:
        description: "Fully qualified refs/tags/vMAJOR.MINOR.PATCH release source"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vMAJOR.MINOR.PATCH tag to qualify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    # This label is repository-owned. GitHub-hosted runners are not substitutes: they do not
    # establish a disposable GUI login, the required TCC grants, or private-API host support.
    runs-on: [self-hosted, macOS, ARM64, spaceo-live-qualified]
    environment: live-qualification
    timeout-minutes: 60
    env:
      SPACEO_QUALIFICATION_REF: ${{ inputs.release_ref || format('refs/tags/{0}', inputs.release_tag) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref || format('refs/tags/{0}', inputs.release_tag) }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate qualified release source and platform
        run: |
          set -euo pipefail
          [[ "$SPACEO_QUALIFICATION_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify --quiet "$SPACEO_QUALIFICATION_REF"
          test "$(git rev-parse HEAD^{commit})" = \
            "$(git rev-parse "$SPACEO_QUALIFICATION_REF^{commit}")"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          bash -n scripts/test.sh

      - name: Run live WindowServer, app, capture, and input qualification
        env:
          SPACEO_LIVE_QUALIFICATION: "1"
          # These environment-scoped variables must be deliberately configured to "1".
          # Their presence does not claim that environment protection or TCC setup exists.
          SPACEO_QUALIFIED_HOST: ${{ vars.SPACEO_QUALIFIED_HOST }}
          SPACEO_DISPOSABLE_LOGIN: ${{ vars.SPACEO_DISPOSABLE_LOGIN }}
          SPACEO_LIVE_RESULT: ${{ runner.temp }}/spaceo-live-qualification.txt
          SPACEO_LIVE_LOG: ${{ runner.temp }}/spaceo-live-qualification-tests.log
        run: bash scripts/test.sh live

      - name: Retain qualification record and test log
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: SpaceO-live-qualification
          path: |
            ${{ runner.temp }}/spaceo-live-qualification.txt
            ${{ runner.temp }}/spaceo-live-qualification-tests.log
          if-no-files-found: warn
