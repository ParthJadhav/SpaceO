name: Signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vMAJOR.MINOR.PATCH tag to package without publishing"
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-qualification:
    permissions:
      contents: read
    uses: ./.github/workflows/live-qualification.yml
    with:
      release_ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.release_tag) }}

  distribution:
    needs: live-qualification
    # macos-15 is an Apple Silicon image; the script also fails if the architecture drifts.
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      SPACEO_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual input is data, not a generic Git checkout expression. Fully qualifying the
          # tag prevents a same-named branch from supplying code to this credentialed job.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate immutable release source
        id: source
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$SPACEO_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "error: release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          release_ref="refs/tags/$SPACEO_RELEASE_TAG"
          git show-ref --verify --quiet "$release_ref" || {
            echo "error: $release_ref is not an existing tag" >&2
            exit 1
          }
          release_commit="$(git rev-parse "$release_ref^{commit}")"
          release_tag_object="$(git rev-parse "$release_ref")"
          checked_out_commit="$(git rev-parse "HEAD^{commit}")"
          [[ "$release_commit" == "$checked_out_commit" ]] || {
            echo "error: checkout does not match $release_ref" >&2
            exit 1
          }
          default_branch_ref="refs/remotes/origin/$GITHUB_DEFAULT_BRANCH"
          git show-ref --verify --quiet "$default_branch_ref" || {
            echo "error: the trusted default branch was not fetched" >&2
            exit 1
          }
          default_branch_commit="$(git rev-parse "$default_branch_ref^{commit}")"
          git merge-base --is-ancestor "$release_commit" "$default_branch_commit" || {
            echo "error: release commit is not contained in $GITHUB_DEFAULT_BRANCH" >&2
            exit 1
          }
          echo "tag_object=$release_tag_object" >> "$GITHUB_OUTPUT"

      - name: Validate release policy, tag, and repository version
        run: |
          bash Tests/ReleaseSecurityTests.sh
          bash scripts/release.sh check

      - name: Download live qualification evidence
        uses: actions/download-artifact@v4
        with:
          name: SpaceO-live-qualification
          path: ${{ runner.temp }}/spaceo-live-qualification

      - name: Verify live qualification evidence
        run: |
          bash scripts/test.sh verify-live-record \
            "$RUNNER_TEMP/spaceo-live-qualification/spaceo-live-qualification.txt"

      - name: Require release credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY \
            NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "error: release credential inputs are missing: ${missing[*]}" >&2
            exit 1
          fi

      - name: Build, sign, notarize, staple, and verify
        id: package
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          SPACEO_CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          SPACEO_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          SPACEO_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPACEO_LIVE_QUALIFICATION_RECORD: ${{ runner.temp }}/spaceo-live-qualification/spaceo-live-qualification.txt
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/spaceo-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/spaceo-notary-key.p8"
          keychain_path="$RUNNER_TEMP/spaceo-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path" "$notary_key_path"
          }
          trap cleanup EXIT

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null

          SPACEO_NOTARY_KEY="$notary_key_path" bash scripts/release.sh package

          version="$(tr -d '\r\n' < VERSION)"
          architecture="$(uname -m)"
          artifact=".release/$version/SpaceO-$version-macOS-$architecture.dmg"
          checksum=".release/$version/SpaceO-$version-macOS-$architecture.sha256"
          signature="$checksum.sig"
          [[ -f "$artifact" && -f "$checksum" && -f "$signature" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"

      - name: Retain verified workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpaceO-${{ steps.package.outputs.version }}-macOS
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.signature }}
          if-no-files-found: error

      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_OBJECT: ${{ steps.source.outputs.tag_object }}
        run: |
          remote_tag_object="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha
          )"
          [[ "$remote_tag_object" == "$EXPECTED_TAG_OBJECT" ]] || {
            echo "error: release tag moved after source validation" >&2
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.artifact }}" \
            "${{ steps.package.outputs.checksum }}" \
            "${{ steps.package.outputs.signature }}" \
            --verify-tag \
            --generate-notes \
            --title "SpaceO ${{ steps.package.outputs.version }}"
