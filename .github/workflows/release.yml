name: Signed release candidate and publication

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vMAJOR.MINOR.PATCH tag to package without publishing"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  protection:
    permissions:
      contents: read
      actions: read
    # Disabled throughout private open-source preparation.
    if: vars.SPACEO_RELEASE_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require configured release approval boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for environment in release release-publication; do
            gh api "repos/$GITHUB_REPOSITORY/environments/$environment" |
              jq -e '.deployment_branch_policy.custom_branch_policies == true and
                any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/environments/$environment/deployment-branch-policies" |
              jq -e '.branch_policies | length > 0 and all(.[]; .type == "tag" and .name == "v*")' >/dev/null
          done

  candidate:
    needs: protection
    # Disposable GitHub-hosted Apple Silicon runner.
    runs-on: macos-15
    timeout-minutes: 45
    # This existing credential boundary may protect signing/notarization. Publication has its own
    # post-artifact environment below and receives none of these secrets.
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      tag_object: ${{ steps.source.outputs.tag_object }}
      commit: ${{ steps.source.outputs.commit }}
      candidate_name: ${{ steps.package.outputs.candidate_name }}
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      artifact_digest: ${{ steps.retain.outputs.artifact-digest }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SPACEO_REQUIRED_XCODE_VERSION: "26.3"
      SPACEO_REQUIRED_SWIFT_VERSION: "6.2"
      SPACEO_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual input is data, not a generic Git checkout expression. Fully qualifying the
          # tag prevents a same-named branch from supplying code to this credentialed job.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require pinned release toolchain
        run: bash scripts/check-swift-toolchain.sh

      - name: Validate immutable release source
        id: source
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$SPACEO_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "error: release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          release_ref="refs/tags/$SPACEO_RELEASE_TAG"
          git show-ref --verify --quiet "$release_ref" || {
            echo "error: $release_ref is not an existing tag" >&2
            exit 1
          }
          release_commit="$(git rev-parse "$release_ref^{commit}")"
          release_tag_object="$(git rev-parse "$release_ref")"
          checked_out_commit="$(git rev-parse "HEAD^{commit}")"
          [[ "$release_commit" == "$checked_out_commit" ]] || {
            echo "error: checkout does not match $release_ref" >&2
            exit 1
          }
          default_branch_ref="refs/remotes/origin/$GITHUB_DEFAULT_BRANCH"
          git show-ref --verify --quiet "$default_branch_ref" || {
            echo "error: the trusted default branch was not fetched" >&2
            exit 1
          }
          default_branch_commit="$(git rev-parse "$default_branch_ref^{commit}")"
          git merge-base --is-ancestor "$release_commit" "$default_branch_commit" || {
            echo "error: release commit is not contained in $GITHUB_DEFAULT_BRANCH" >&2
            exit 1
          }
          {
            echo "tag=$SPACEO_RELEASE_TAG"
            echo "tag_object=$release_tag_object"
            echo "commit=$release_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release policy, tag, and repository version
        run: |
          bash Tests/ReleaseSecurityTests.sh
          bash scripts/release.sh check

      - name: Require release credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY \
            NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "error: release credential inputs are missing: ${missing[*]}" >&2
            exit 1
          fi

      - name: Build and qualify immutable release candidate
        id: package
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          SPACEO_CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          SPACEO_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          SPACEO_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPACEO_RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          SPACEO_RELEASE_TAG_OBJECT: ${{ steps.source.outputs.tag_object }}
          SPACEO_RELEASE_WORKFLOW_REPOSITORY: ${{ github.repository }}
          SPACEO_RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          SPACEO_RELEASE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          certificate_path="$RUNNER_TEMP/spaceo-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/spaceo-notary-key.p8"
          keychain_path="$RUNNER_TEMP/spaceo-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path" "$notary_key_path"
          }
          trap cleanup EXIT

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null

          SPACEO_NOTARY_KEY="$notary_key_path" bash scripts/release.sh candidate

          version="$(tr -d '\r\n' < VERSION)"
          architecture="$(uname -m)"
          base=".release/$version/SpaceO-$version-macOS-$architecture"
          artifact="$base.dmg"
          checksum="$base.sha256"
          checksum_signature="$checksum.sig"
          candidate_record="$base.candidate.txt"
          candidate_signature="$candidate_record.sig"
          test -f "$artifact"
          test -f "$checksum"
          test -f "$checksum_signature"
          test -f "$candidate_record"
          test -f "$candidate_signature"
          {
            echo "version=$version"
            echo "base=$base"
            echo "candidate_name=SpaceO-candidate-$version-${{ steps.source.outputs.tag_object }}-${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"

      - name: Retain immutable candidate and verification metadata
        id: retain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.candidate_name }}
          path: |
            ${{ steps.package.outputs.base }}.dmg
            ${{ steps.package.outputs.base }}.sha256
            ${{ steps.package.outputs.base }}.sha256.sig
            ${{ steps.package.outputs.base }}.candidate.txt
            ${{ steps.package.outputs.base }}.candidate.txt.sig
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 90

  publication:
    needs: candidate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 20
    # Configure required reviewers on this environment. Approval occurs only after the immutable
    # candidate artifact exists, and this job never receives signing or notarization credentials.
    environment: release-publication
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SPACEO_REQUIRED_XCODE_VERSION: "26.3"
      SPACEO_REQUIRED_SWIFT_VERSION: "6.2"
      SPACEO_RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
      SPACEO_RELEASE_COMMIT: ${{ needs.candidate.outputs.commit }}
      SPACEO_RELEASE_TAG_OBJECT: ${{ needs.candidate.outputs.tag_object }}
      SPACEO_RELEASE_WORKFLOW_REPOSITORY: ${{ github.repository }}
      SPACEO_RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
      SPACEO_RELEASE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.candidate.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require pinned release toolchain
        run: bash scripts/check-swift-toolchain.sh

      - name: Revalidate immutable publication source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_ref="refs/tags/$SPACEO_RELEASE_TAG"
          test "$(git rev-parse "HEAD^{commit}")" = "$SPACEO_RELEASE_COMMIT"
          test "$(git rev-parse "$release_ref^{commit}")" = "$SPACEO_RELEASE_COMMIT"
          test "$(git rev-parse "$release_ref")" = "$SPACEO_RELEASE_TAG_OBJECT"
          remote_tag_object="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SPACEO_RELEASE_TAG" --jq .object.sha
          )"
          test "$remote_tag_object" = "$SPACEO_RELEASE_TAG_OBJECT"

      - name: Download exact immutable candidate by artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/spaceo-release-candidate

      - name: Independently verify retained candidate
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.candidate.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          bash Tests/ReleaseSecurityTests.sh
          version="$(tr -d '\r\n' < VERSION)"
          candidate_record="$RUNNER_TEMP/spaceo-release-candidate/SpaceO-$version-macOS-arm64.candidate.txt"
          bash scripts/release.sh verify-candidate "$candidate_record"

      - name: Publish already-qualified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_tag_object="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SPACEO_RELEASE_TAG" --jq .object.sha
          )"
          [[ "$remote_tag_object" == "$SPACEO_RELEASE_TAG_OBJECT" ]] || {
            echo "error: release tag moved after candidate qualification" >&2
            exit 1
          }
          version="$(tr -d '\r\n' < VERSION)"
          base="$RUNNER_TEMP/spaceo-release-candidate/SpaceO-$version-macOS-arm64"
          gh release create "$SPACEO_RELEASE_TAG" \
            "$base.dmg" \
            "$base.sha256" \
            "$base.sha256.sig" \
            "$base.candidate.txt" \
            "$base.candidate.txt.sig" \
            --verify-tag \
            --generate-notes \
            --title "SpaceO $version"
