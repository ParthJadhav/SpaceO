name: Live WindowServer tests

# The deterministic suite in CI never touches a WindowServer, so Stage create/destroy, tile
# isolation, capture, input routing, the DevTools bridge, and late-window containment have no
# automated coverage at all. This runs the suite that does cover them.
#
# It is deliberately NOT an automated release gate. Commit 43a39d6 removed the Round-8
# live-qualification gates by owner decision (RELEASE_AUDIT Round 9): no host attestation, no
# commit-bound qualification record, and no release.sh dependency are reinstated here. A green
# no-skip run is still required release-approval EVIDENCE under docs/RELEASE_POLICY.md — the
# release owner reviews it at go/no-go; nothing mechanical blocks packaging on it. The one
# property Round 9 left unreplaced is that a suite which skips every test is indistinguishable
# from one that passes; --require-full is what closes that, and it applies only to this job.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this qualification run is being made (recorded in the run log)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Resolve an explicitly provisioned live host from a disposable hosted runner.
  preflight:
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/main' && vars.SPACEO_LIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      labels: ${{ steps.runner.outputs.labels }}
    steps:
      - name: Require protected dedicated-host qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/live-qualification" |
            jq -e '.deployment_branch_policy.custom_branch_policies == true and
              any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/live-qualification/deployment-branch-policies" |
            jq -e '.branch_policies | length > 0 and all(.[]; .type == "branch" and .name == "main")' >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify the skip gate before depending on it
        run: |
          bash -n scripts/test.sh scripts/check-live-test-run.sh
          bash Tests/LiveTestGateTests.sh

      - name: Resolve the live runner
        id: runner
        env:
          # JSON array of runner labels, e.g. ["self-hosted","macOS","ARM64","spaceo-live"].
          # Repository variable, not a secret: it names a runner, it does not authorise one.
          LIVE_RUNNER_LABELS: ${{ vars.SPACEO_LIVE_RUNNER_LABELS }}
        run: |
          set -euo pipefail
          if [[ -z "${LIVE_RUNNER_LABELS:-}" ]]; then
            echo "::error::No live test host is configured. Set the repository variable" \
                 "SPACEO_LIVE_RUNNER_LABELS to the JSON label array of a registered" \
                 "self-hosted Apple Silicon runner that has been granted Accessibility and" \
                 "Screen Recording. See docs/LIVE_TESTS.md. Failing rather than skipping:" \
                 "a live suite that silently does not run is the defect this workflow exists" \
                 "to prevent."
            exit 1
          fi
          # Fail here rather than letting an unparseable value become an invalid runs-on, which
          # surfaces as an unhelpful workflow-level error with no line to point at.
          python3 -c "import json,os,sys; v=json.loads(os.environ['LIVE_RUNNER_LABELS']); sys.exit(0 if isinstance(v,list) and v and all(isinstance(x,str) and x for x in v) and 'spaceo-live' in v and 'spaceo-mac' not in v else 1)" || {
            echo "::error::SPACEO_LIVE_RUNNER_LABELS must be a non-empty JSON array of strings," \
                 "for example [\"self-hosted\",\"macOS\",\"ARM64\",\"spaceo-live\"]"
            exit 1
          }
          echo "resolved live runner labels: $LIVE_RUNNER_LABELS"
          echo "labels=$LIVE_RUNNER_LABELS" >> "$GITHUB_OUTPUT"

  live:
    needs: preflight
    environment: live-qualification
    # Repository-owned host. A GitHub-hosted runner cannot satisfy this: it has no graphical
    # login, no Accessibility or Screen Recording grant, and no support for the private
    # virtual-display API, so every test would skip and --require-full would fail the run.
    runs-on: ${{ fromJSON(needs.preflight.outputs.labels) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record host capabilities
        env:
          RUN_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          printf 'reason: %s\n' "$RUN_REASON"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
          swift --version
          # Not a gate: `--require-full` already fails the run if the grants are missing. This is
          # here so the artifact explains *which* grant was missing when that happens.
          swift run spaceo doctor || true

      - name: Run the live WindowServer suite
        # `runner.temp` resolves only in a step context; a job-level `env` referencing it makes
        # GitHub reject the whole workflow file before any job starts.
        env:
          SPACEO_LIVE_LOG: ${{ runner.temp }}/spaceo-live-tests.log
        run: bash scripts/test.sh live --require-full

      - name: Run the full computer-use conformance matrix
        env:
          SPACEO_TEST_REPORT: ${{ runner.temp }}/spaceo-computer-use-conformance.json
          SPACEO_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: make computer-use-check-full

      - name: Retain the live run log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spaceo-live-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spaceo-live-tests.log
          if-no-files-found: error

      - name: Retain the computer-use conformance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spaceo-computer-use-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spaceo-computer-use-conformance.json
          if-no-files-found: error
